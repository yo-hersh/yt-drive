name: Download to Drive
run-name: "${{ inputs.mode }} · ${{ inputs.url }}${{ inputs.attempt != '1' && format(' · #{0}', inputs.attempt) || '' }}"

on:
  workflow_dispatch:
    inputs:
      url:
        description: "קישור / Link"
        required: true
        type: string
      mode:
        description: "סוג / Type"
        type: choice
        options: [video, mp3, subs]
        default: video
      quality:
        description: "איכות / Quality"
        type: choice
        options: ["1080", "720", "480", "360", "max", "small"]
        default: "1080"
      items:
        description: "פריטים מהפלייליסט, למשל 3-7 או 1,4 / Playlist items, e.g. 3-7 or 1,4"
        type: string
        default: ""
      whole_playlist:
        description: "כל הפלייליסט / Whole playlist"
        type: boolean
        default: false
      embed_subs:
        description: "להטמיע כתוביות בסרטון / Embed subtitles in the video"
        type: boolean
        default: false
      sub_langs:
        description: "שפות כתוביות, למשל he, en, he,en או all / Subtitle languages, e.g. he, en, he,en or all"
        type: string
        default: he
      stop_after_minutes:
        description: "לעצור אחרי X דקות, לשידור חי. ריק = בלי הגבלה / Stop after X minutes, for live streams. Empty = no limit"
        type: string
        default: ""
      folder:
        description: "תיקייה בדרייב / Drive folder"
        type: string
        default: YouTube
      upload_via:
        description: "דרך ההעלאה לדרייב / Drive upload method"
        type: choice
        options: [apps_script, rclone]
        default: apps_script
      lang:
        description: "שפת ההודעות / Message language"
        type: choice
        options: [he, en]
        default: he
      attempt:
        description: "מספר ניסיון. למילוי אוטומטי בלבד / Attempt number, filled in automatically"
        type: string
        default: "1"

permissions:
  contents: read
  actions: write # the automatic retry starts a new run of this workflow

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp, ffmpeg
        run: |
          python -m pip install -q -U --progress-bar off "yt-dlp[default,deno,curl-cffi]" requests
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }

      - name: rclone
        if: inputs.upload_via == 'rclone'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"; fi

      - name: Download and upload
        id: dl
        env:
          YT_URL: ${{ inputs.url }}
          YT_MODE: ${{ inputs.mode }}
          YT_QUALITY: ${{ inputs.quality }}
          YT_ITEMS: ${{ inputs.items }}
          YT_WHOLE_PLAYLIST: ${{ inputs.whole_playlist }}
          YT_EMBED_SUBS: ${{ inputs.embed_subs }}
          YT_SUB_LANGS: ${{ inputs.sub_langs }}
          YT_STOP_MINUTES: ${{ inputs.stop_after_minutes }}
          YT_ATTEMPT: ${{ inputs.attempt }}
          DRIVE_FOLDER: ${{ inputs.folder }}
          DRIVE_UPLOADER: ${{ inputs.upload_via }}
          YT_LANG: ${{ inputs.lang }}
          YT_COOKIES_FILE: ${{ runner.temp }}/cookies.txt
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_KEY: ${{ secrets.DRIVE_KEY }}
        run: python download.py

      # YouTube blocked this runner's IP: the same settings again as a new run, on a new runner.
      # download.py decides (steps.dl.outputs.retry) and caps the number of attempts.
      - name: Retry on a new server
        if: failure() && steps.dl.outputs.retry == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          YT_URL: ${{ inputs.url }}
          YT_MODE: ${{ inputs.mode }}
          YT_QUALITY: ${{ inputs.quality }}
          YT_ITEMS: ${{ inputs.items }}
          YT_WHOLE_PLAYLIST: ${{ inputs.whole_playlist }}
          YT_EMBED_SUBS: ${{ inputs.embed_subs }}
          YT_SUB_LANGS: ${{ inputs.sub_langs }}
          YT_STOP_MINUTES: ${{ inputs.stop_after_minutes }}
          DRIVE_FOLDER: ${{ inputs.folder }}
          DRIVE_UPLOADER: ${{ inputs.upload_via }}
          YT_LANG: ${{ inputs.lang }}
          NEXT_ATTEMPT: ${{ steps.dl.outputs.next_attempt }}
        run: |
          gh workflow run download.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f url="$YT_URL" -f mode="$YT_MODE" -f quality="$YT_QUALITY" -f items="$YT_ITEMS" \
            -f whole_playlist="$YT_WHOLE_PLAYLIST" -f embed_subs="$YT_EMBED_SUBS" \
            -f sub_langs="$YT_SUB_LANGS" -f stop_after_minutes="$YT_STOP_MINUTES" \
            -f folder="$DRIVE_FOLDER" -f upload_via="$DRIVE_UPLOADER" -f lang="$YT_LANG" \
            -f attempt="$NEXT_ATTEMPT"
